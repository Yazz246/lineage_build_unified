name: Build LOS20 GSI
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gperf lib32ncurses5-dev lib32z1-dev libelf-dev liblz4-tool libncurses5-dev libssl-dev libxml2-utils lzop rsync squashfs-tools xsltproc zip zlib1g-dev openjdk-17-jdk python3 xz-utils
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"
      - name: Sync & build
        run: |
          export PATH=~/bin:$PATH
          mkdir los && cd los
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --depth=1 --git-lfs
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          git clone https://github.com/${{ github.repository_owner }}/lineage_build_unified -b lineage-20-td
          git clone https://github.com/${{ github.repository_owner }}/lineage_patches_unified -b lineage-20-td
          bash lineage_build_unified/buildbot_unified.sh treble 64GN
      - uses: actions/upload-artifact@v4
        with:
          name: gsi
          path: los/release/**
